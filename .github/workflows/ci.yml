name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: legalgraph
          POSTGRES_PASSWORD: legalgraph-dev
          POSTGRES_DB: legalgraph
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legalgraph" --health-interval 5s
          --health-timeout 5s --health-retries 12
      neo4j:
        # CI dùng Neo4j không plugin cho nhanh – test GDS tự skip
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/legalgraph-dev
        ports: ["7687:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p legalgraph-dev 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 15

    env:
      DATABASE_URL: postgresql+asyncpg://legalgraph:legalgraph-dev@localhost:5432/legalgraph
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: legalgraph-dev
      # Bắt buộc có PG + Neo4j: thiếu thì test FAIL thay vì skip. ES chưa có trong CI (cần plugin ICU).
      REQUIRE_SERVICES: postgres,neo4j

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.1"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app scripts
      - run: uv run pytest -q
