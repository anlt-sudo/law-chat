[project]
name = "legalgraph-backend"
version = "0.1.0"
description = "LegalGraph – chatbot tra cứu văn bản pháp luật ứng dụng GraphRAG (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "neo4j>=5.26,<6",
    "elasticsearch[async]>=8.15,<9",
    "httpx>=0.27",
    "tzdata>=2024.2",          # zoneinfo trên Windows cần dữ liệu múi giờ
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.uv]
package = false   # app chạy từ thư mục backend/, không cần build wheel

# ---------------- pytest ----------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: cần PostgreSQL / Neo4j / Elasticsearch đang chạy (tự skip nếu không có, trừ khi REQUIRE_SERVICES đặt)",
    "lmstudio: gọi LM Studio thật, chỉ chạy khi RUN_LMSTUDIO=1",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# ---------------- ruff ----------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # cho phép ký tự Unicode tiếng Việt trong chuỗi / comment
    "B008",                          # FastAPI Depends() trong default argument
]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

# ---------------- mypy ----------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
